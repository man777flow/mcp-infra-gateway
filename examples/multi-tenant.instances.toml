# Example instances.toml for a multi-tenant setup — an ops team running its
# own infrastructure plus monitoring for two separate client organizations.
# All URLs and tokens below are mock data, purely illustrative. To actually
# use this shape: `cp examples/multi-tenant.instances.toml instances.toml`,
# then replace every url/api_token with your real ones and pick free ports.
#
# Naming pattern used here: <org>-<env>. Each instance registers with AI
# clients as <type>-<name>, e.g. zabbix-acme-prod, grafana-client-a-prod.

# --- Zabbix ---------------------------------------------------------------

[[zabbix]]
name = "acme-prod"
url = "https://zabbix.acme-ops.example.com"
api_token = "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
port = 8001
admin_port = 9001
read_only = false
verify_ssl = true

[[zabbix]]
name = "client-a-prod"
url = "https://zabbix.client-a.example.com"
api_token = "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"
port = 8002
admin_port = 9002
read_only = true          # this team only monitors client-a, doesn't manage it
verify_ssl = true

[[zabbix]]
name = "client-b-staging"
url = "https://zabbix-staging.client-b.example.com"
api_token = "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4"
port = 8003
admin_port = 9003
read_only = true
verify_ssl = false        # self-signed cert on client-b's staging instance

# --- Grafana ----------------------------------------------------------------

[[grafana]]
name = "acme-prod"
url = "https://grafana.acme-ops.example.com"
api_token = "glsa_MockServiceAccountToken0000000000000000_a1b2c3d4"
port = 8101

[[grafana]]
name = "client-a-prod"
url = "https://grafana.client-a.example.com"
api_token = "glsa_MockServiceAccountToken1111111111111111_b2c3d4e5"
port = 8102

# --- Nautobot ---------------------------------------------------------------

[[nautobot]]
name = "acme-prod"
url = "https://nautobot.acme-ops.example.com/"
api_token = "d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5"
port = 8201
github_token = ""          # optional, only needed for knowledge-base search
